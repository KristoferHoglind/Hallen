services:
  postgres:
    image: postgres:17
    container_name: hallen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: hallen
    ports:
      - "5432:5432"
    volumes:
      - hallen_postgres_data:/var/lib/postgresql/data

volumes:
  hallen_postgres_data: